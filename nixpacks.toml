# Railway build config for Rails 8 + SQLite
# Nixpacks auto-detects Ruby from .ruby-version via ruby-build

[phases.setup]
nixPkgs = ["libyaml", "sqlite"]

[phases.install]
cmds = ["bundle install"]

[phases.build]
cmds = [
  "bundle exec bootsnap precompile --gemfile",
  "SECRET_KEY_BASE_DUMMY=1 bundle exec rails assets:precompile"
]

[start]
cmd = "bin/railway-start"
