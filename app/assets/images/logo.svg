<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340">

  <!-- Dark navy background -->
  <rect width="300" height="340" fill="#0c1a28" rx="28"/>

  <!-- Question mark shadow cast by the runner (subtle, slightly lighter than background) -->
  <path d="M 108,208
           C 105,180 127,156 154,153
           C 182,150 200,170 200,194
           C 200,218 182,234 163,242
           C 161,244 157,250 157,262
           L 157,284"
        fill="none"
        stroke="#f0ebe0"
        stroke-opacity="0.14"
        stroke-width="17"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="157" cy="302" r="10"
          fill="#f0ebe0" fill-opacity="0.14"/>

  <!-- Runner silhouette — cream, mid-stride, leaning forward, facing right -->
  <g fill="none" stroke="#f0ebe0" stroke-width="6.5"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Head (solid) -->
    <circle cx="152" cy="46" r="14" fill="#f0ebe0" stroke="none"/>

    <!-- Torso: neck to hip, forward lean -->
    <line x1="154" y1="60" x2="164" y2="92"/>

    <!-- Forward arm: upper arm reaches left, forearm angles up-forward -->
    <polyline points="158,72 144,74 132,62"/>

    <!-- Back arm: upper arm reaches right, forearm trails down-back -->
    <polyline points="160,74 173,79 183,92"/>

    <!-- Forward leg: thigh angles forward, knee snaps, foot strikes -->
    <polyline points="164,92 178,119 186,115 192,134"/>

    <!-- Back leg: thigh trails back, lower leg kicks up behind -->
    <polyline points="164,92 154,117 151,133 154,150"/>

  </g>

</svg>
